[workspace]
resolver = "2"
members = [
    "projects/engine/*",
    "projects/adapters/*",
    "projects/bindings/*",
    "projects/tooling/*",
]
default-members = ["projects/bindings/ra-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "Apache-2.0"

[workspace.dependencies]
ra-types = { path = "projects/engine/ra-types" }
ra-assets = { path = "projects/engine/ra-assets" }
ra-config = { path = "projects/engine/ra-config" }
ra-map = { path = "projects/engine/ra-map" }
ra-engine = { path = "projects/engine/ra-engine" }
ra-ecs = { path = "projects/engine/ra-ecs" }
ra-testing = { path = "projects/tooling/ra-testing" }
ra-net = { path = "projects/engine/ra-net" }
ra-renderer = { path = "projects/engine/ra-renderer" }
ra-adaptor = { path = "projects/adapters/ra-adaptor" }
ra-adaptor-ra2 = { path = "projects/adapters/ra-adaptor-ra2" }
ra-adaptor-yuri = { path = "projects/adapters/ra-adaptor-yuri" }
ra-adaptor-phobos = { path = "projects/adapters/ra-adaptor-phobos" }
thiserror = "2"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# wgpu-hal DX12 与 gpu-allocator 须共用同一条 `windows` 线（0.62）。
# `gpu-allocator` 允许 0.53..=0.62，解析器可能落到 0.58；`Cargo.lock` 已钉到 0.62.2。
wgpu = { version = "30.0.1", default-features = true }
winit = "0.30"
pollster = "1.0.1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
blowfish = "0.10.0"
byteorder = "1"
num-bigint = "0.5"
base64 = "0.23.1"
oak-ini = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
toml_edit = "0.25"
napi = { version = "3", default-features = true, features = ["napi4"] }
napi-derive = "3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "symbols"
panic = "abort"
