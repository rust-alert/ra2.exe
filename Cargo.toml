[workspace]
resolver = "2"
members = ["projects/*"]
default-members = ["projects/ra-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
ra-types = { path = "projects/ra-types" }
ra-assets = { path = "projects/ra-assets" }
ra-config = { path = "projects/ra-config" }
ra-map = { path = "projects/ra-map" }
ra-world = { path = "projects/ra-world" }
ra-session = { path = "projects/ra-session" }
ra-engine = { path = "projects/ra-engine" }
ra-testing = { path = "projects/ra-testing" }
ra-logger = { path = "projects/ra-logger" }
ra-net = { path = "projects/ra-net" }
ra-renderer = { path = "projects/ra-renderer" }
ra-adaptor = { path = "projects/ra-adaptor" }
ra-adaptor-ra2 = { path = "projects/ra-adaptor-ra2" }
ra-adaptor-yuri = { path = "projects/ra-adaptor-yuri" }
ra-adaptor-phobos = { path = "projects/ra-adaptor-phobos" }
thiserror = "2"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
# wgpu-hal DX12 与 gpu-allocator 须共用同一条 `windows` 线（0.62）。
# `gpu-allocator` 允许 0.53..=0.62，解析器可能落到 0.58；`Cargo.lock` 已钉到 0.62.2。
wgpu = { version = "30.0.1", default-features = true }
winit = "0.30"
pollster = "1.0.1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
blowfish = "0.10.0"
byteorder = "1"
num-bigint = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "symbols"
panic = "abort"
