[package]
name = "ra-renderer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "wgpu 呈现层（桌面 DX12 / Vulkan / Metal；浏览器 WebGL2 方向）"
keywords = ["red-alert-2", "wgpu", "rendering", "webgl2"]
categories = ["game-development", "rendering", "graphics"]
publish = false

[dependencies]
ra-types = { workspace = true }
ra-engine = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true }

[dev-dependencies]
ra-map = { workspace = true }

# 拉齐 `gpu-allocator` 与 `wgpu-hal` 的 `windows` 版本（DX12 子分配类型必须一致）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }

