[package]
name = "ra-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Node-API 绑定与原生宿主（窗口 / 输入 / 事件循环），产出平台 `.node`"
keywords = ["red-alert-2", "napi", "nodejs", "native-addon"]
categories = ["game-development", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib"]
name = "ra_napi"
path = "src/lib.rs"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
ra-desktop = { workspace = true }
ra-config = { workspace = true }

[build-dependencies]
napi-build = "2"
