[package]
name = "ra-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Node-API 绑定与原生宿主（窗口 / 输入 / 事件循环），产出平台 `.node`"
keywords = ["red-alert-2", "napi", "nodejs", "native-addon"]
categories = ["game-development", "api-bindings"]
publish = false
autobins = false
autoexamples = false
autotests = true
autobenches = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "ra_napi"
path = "src/lib.rs"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
ra-types = { workspace = true }
ra-config = { workspace = true }
ra-adaptor = { workspace = true }
ra-assets = { workspace = true }
ra-map = { workspace = true }
ra-engine = { workspace = true }
ra-net = { workspace = true }
ra-renderer = { workspace = true }
ra-layout = { workspace = true }
ra-components = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
winit = { workspace = true }
rodio = { workspace = true }

[features]
default = []
test-harness = ["dep:ra-testing"]

[dependencies.ra-testing]
workspace = true
optional = true

[build-dependencies]
napi-build = "2"