[package]
name = "ra-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Wasm / WebGL2 绑定与浏览器宿主（画布 / 输入 / 装载），产出 `@game-gpt/red-alert2-unknown-wasm32`"
keywords = ["red-alert-2", "wasm", "webgl2", "wasm-bindgen"]
categories = ["game-development", "wasm", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "ra_wasm"
path = "src/lib.rs"

[dependencies]
# 宿主与引擎接线按切片推进；当前先保证 wasm-bindgen 产物与 host 骨架可编。
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
