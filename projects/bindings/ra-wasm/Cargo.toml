[package]
name = "ra-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Wasm 绑定与浏览器宿主（画布 / 输入 / 装载）；经 wgpu 呈现，产出 `@game-gpt/red-alert2-unknown-wasm32`"
keywords = ["red-alert-2", "wasm", "wgpu", "wasm-bindgen"]
categories = ["game-development", "wasm", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "ra_wasm"
path = "src/lib.rs"

[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { workspace = true }
ra-types = { workspace = true }
ra-assets = { workspace = true }
ra-adaptor = { workspace = true }
ra-renderer = { workspace = true }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
