[package]
name = "ra-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "原生窗口 / 输入 / 事件循环；仅由 `ra-napi` 拉起，不是独立产品入口"
publish = false

[lib]
name = "ra_desktop"
path = "src/lib.rs"

[dependencies]
ra-types = { workspace = true }
ra-config = { workspace = true }
ra-adaptor = { workspace = true }
ra-assets = { workspace = true }
ra-map = { workspace = true }
ra-engine = { workspace = true }
ra-net = { workspace = true }
ra-renderer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
winit = { workspace = true }
rodio = { workspace = true }

[features]
default = []
# 仅测试构建：合成场景启动 + 状态旁路文件（依赖 `ra-testing`）。
test-harness = ["dep:ra-testing"]

[dependencies.ra-testing]
workspace = true
optional = true
